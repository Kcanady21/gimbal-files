# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
members = ["crates/*"]
exclude = ["spike"]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/Kcanady21/gimbal-files"

[workspace.dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_9"] }
gdk4-wayland = { version = "=0.11.5", features = ["wayland_crate"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
glib = "=0.22.10"
gio = "=0.22.10"
toml_edit = "=0.25.17"
# P2v: the notice-only update check. ureq uses rustls and the OS certificate
# verifier (platform-verifier) rather than a bundled root list;
# minisign-verify checks the signed release notice.
ureq = { version = "=3.5.1", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
minisign-verify = "=0.3.0"
fm-core = { path = "crates/fm-core" }
fm-ui = { path = "crates/fm-ui" }
fm-agent = { path = "crates/fm-agent" }
fm-cli = { path = "crates/fm-cli" }

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
# File and line tables for apport crash reports. build-deb.sh splits them into
# gimbal-files-dbgsym; release binaries stay small for users.
debug = "line-tables-only"
