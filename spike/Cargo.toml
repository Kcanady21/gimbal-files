# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "gimbal-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "=0.11.5", features = ["v4_22"] }
adw = { package = "libadwaita", version = "=0.9.2", features = ["v1_9"] }
gdk4-wayland = { version = "=0.11.5", features = ["wayland_crate"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
